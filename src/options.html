<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Quick PR settings</title>
  <style>
    body { font: 14px/20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 16px; min-width: 420px; }
    label { display: block; margin-bottom: 16px; font-weight: 600; }
    input[type=text], textarea { display: block; width: 100%; box-sizing: border-box; margin-top: 4px; font: 13px ui-monospace, monospace; padding: 6px; }
    textarea { min-height: 120px; }
    .hint { font-weight: 400; color: #59636e; margin: 4px 0 0; }
    .inline { font-weight: 400; }
    #status { min-height: 20px; }
    .error { color: #d1242f; }
  </style>
</head>
<body>
  <label>Default target branch
    <input id="defaultBranch" type="text" placeholder="Empty: use the target repo default branch">
    <p class="hint">The PR opens into the fork parent (or the same repo, if it is not a fork), on this branch.</p>
  </label>
  <label>Per-repo overrides
    <textarea id="overrides" placeholder="me/my-fork = upstream/project:develop&#10;me/tool = me/tool:release"></textarea>
    <p class="hint">One line for each repo: <code>source/repo = target/repo:branch</code>. The <code>:branch</code> part is optional. Lines that start with # are ignored.</p>
  </label>
  <label class="inline"><input id="openInNewTab" type="checkbox"> Open the PR form in a new tab</label>
  <button id="save" type="button">Save</button>
  <p id="status" role="status"></p>
  <script src="lib.js"></script>
  <script src="options.js"></script>
</body>
</html>
